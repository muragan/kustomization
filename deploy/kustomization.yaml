apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
#### This is kustomization transformers....
commonLabels:
  app: sample-app
  owner: demo-user
commonAnnotations:
  oncallPager: 800-555-1212
namespace: nginx-ns
namePrefix: mgm-
resources:
  - deploy.yaml
  - service.yaml
images:
  - name: nginx
    newName: nginx
    newTag: 1.19.6
##### This is kustomization patches...
patches:
  - target:
      kind: Deployment
      name: nginxdep
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    # File patches
  - target:
      kind: Deployment
      name: nginxdep
    path: patches/patch-file.yaml

